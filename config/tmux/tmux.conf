##### Basic Usage #####

# Use Control-Space as the prefix key
unbind C-b
set -g prefix 'C-Space'
bind 'C-Space' send-prefix

# Reload tmux config so we can pick up changes to this file without needing to restart tmux
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux configuration!"

# Index windows from 1, not 0, so they line up a little better
# with the order of the number keys on the keyboard
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# enable activity alerts
set -g monitor-activity on
set -g visual-activity on

# Ring the bell if any background window rang a bell
set -g bell-action any

set -g display-time 4000
set -g focus-events on
set -sg escape-time 0

##### Terminal #####

set -g default-terminal 'tmux-256color'

# 24-bit color, plus CSI u keys (e.g. distinct C-i and Tab) for apps that ask
set -as terminal-features ',xterm-256color:RGB:extkeys,xterm-ghostty:RGB:extkeys'
set -g extended-keys on

# Let apps inside tmux send escape sequences (images, notifications) to the terminal
set -g allow-passthrough on

##### Scrollback Navigation #####

set -g history-limit 99999

# Use vi-style navigation in Copy mode (which is also scrollback mode)
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Copy tmux selections to terminals that support OSC 52, such as Ghostty.
set -s set-clipboard external
bind -T copy-mode-vi y send -X copy-selection-and-cancel

##### Mouse #####

set -g mouse on

##### Window/Pane Management #####

# Split windows more intuitively
unbind '"'
unbind %
bind | split-window -h -c '#{pane_current_path}' # horizontal columns
bind - split-window -v -c '#{pane_current_path}' # vertical rows

# Navigate panes vim-style!
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# And windows too!
bind -r C-l select-window -t :+
bind -r C-h select-window -t :-

# Quickly jump between two windows
bind i last-window

# Resizing panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r "<" swap-window -t -1
bind -r ">" swap-window -t +1

# Break pane out into new window
bind b break-pane -d

# Quickly switch between sessions
bind C-j choose-tree

# Resize panes immediately for all clients
set -g aggressive-resize on

# Move between Neovim splits and tmux panes with C-h/j/k/l. Neovim hands
# off to tmux at its edges (see lua/keys.lua).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

##### Colors || Visual #####

set -g status-style bg=colour234
set -g status-interval 15
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=colour244,bg=colour232] #S #[fg=colour232,bg=colour234,nobold,nounderscore,noitalics]"
set -g status-right "#{prefix_highlight}#[fg=colour237,bg=colour234]#[fg=colour248,bg=colour237] %a, %b %d %H:%M "

set -g message-style fg=colour234,bg=colour250
set -g message-command-style fg=colour237,bg=colour234

set -g pane-active-border-style fg=colour234,bg=colour234
set -g pane-border-style fg=colour234

set -g window-status-style fg=colour237,bg=colour234
set -g window-status-activity-style fg=colour237,bg=colour234
set -g window-status-separator ""
set -g window-status-format " #[fg=colour238,bg=colour234] #I #[fg=colour241,bg=colour234]#W  "
set -g window-status-current-format "#[fg=colour234,bg=colour237,nobold,nounderscore,noitalics]#[fg=colour242,bg=colour237] #I #[fg=colour252,bg=colour237]#W #[fg=colour237,bg=colour234,nobold,nounderscore,noitalics]"

set -g @prefix_highlight_bg 'cyan'
set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow'

##### Plugins #####

# Keep plugins out of the dotfiles repo
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Install TPM and the plugins above on first launch
if 'test ! -d ~/.tmux/plugins/tpm' \
  "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
