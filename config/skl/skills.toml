# Skills for every machine. Edit this file, then run `skl sync`.
# skills.lock is generated by skl; commit both.

agents = ["claude-code", "codex"]

# Repos that contribute several skills. Names are matched against each skill's
# SKILL.md frontmatter, so no subdirs are needed.
[sources.android]
source = "android/skills"
skills = [
  "adaptive",
  "android-cli",
  "android-intent-security",
  "appfunctions",
  "edge-to-edge",
  "migrate-xml-views-to-jetpack-compose",
  "navigation-3",
  "r8-analyzer",
  "styles",
  "testing-setup",
]

[sources.codex-plugin]
source = "openai/codex-plugin-cc"
skills = "*"

[sources.ios-performance]
source = "Livsy90/iOS-Performance-Agent-Skills"
skills = "*"

[sources.mattpocock]
source = "mattpocock/skills"
skills = ["grill-with-docs", "teach", "wait-what"]

[sources.orca]
source = "stablyai/orca"
skills = ["computer-use", "orca-cli", "orchestration"]

[sources.tuist]
source = "tuist/agent-skills"
skills = [
  "debug-generated-project",
  "fix-flaky-tests",
  "migrating-to-tuist-generated-projects",
  "using-tuist-generated-projects",
]

[sources.xcode-build]
source = "avdlee/xcode-build-optimization-agent-skill"
skills = "*"

# Skills bundled with the selected Xcode, exported with `xcrun agent skills export`.
[xcode]
skills = "*"

# Single-skill repos.
[skills]
apple-hig = "justinwetch/HIGAgentSkills"
cloudkit = "dpearson2699/swift-ios-skills"
find-skills = "vercel-labs/skills"
frontend-design = "anthropics/skills"
hinge = "artemnovichkov/hinge"
i-have-adhd = "ayghri/i-have-adhd"
semantic-review = "mikker/semantic-review"
sosumi = "nshipster/sosumi.ai"
swift-testing-expert = "avdlee/swift-testing-agent-skill"
